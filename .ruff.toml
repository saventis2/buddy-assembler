# Explicit codification of the rule selection this repo has always gated on,
# unaffected by ruff's own default-rule-set changes across versions.
#
# ruff 0.15.x's *default* selection (no config file) was E4, E7, E9, F —
# pyflakes correctness rules plus a handful of pycodestyle error checks — and
# python-lint.yml's blocking `ruff check` job was written and verified against
# that set (see .github/workflows/python-lint.yml and PR #54/#59). ruff 0.16.0
# expanded its default enabled rule set from 59 rules to 413 (see ruff's
# CHANGELOG.md), which would silently widen this repo's blocking CI gate to
# hundreds of additional pre-existing findings on every future ruff upgrade.
#
# This file pins the selection explicitly so `ruff check` keeps gating on
# exactly today's rule set regardless of which ruff version runs it. This is
# a policy-neutral codification of the status quo, not a rejection of the
# wider rule set — adopting ruff 0.16's broader default (or a curated subset
# of it) across tools/importers/, packages/content-validator/, and
# apps/runtime-godot/tools/ remains a maintainer option for a future,
# dedicated PR.
#
# Intentionally does not configure `[format]`: `ruff format` behavior is
# unrelated to lint rule selection and is left untouched.
[lint]
select = ["E4", "E7", "E9", "F"]
