exclude_filter="addons/*,content/promotion_log.json,content/core_pack/character/alt_idle*,content/core_pack/character/climb*,content/core_pack/character/fly*,content/core_pack/character/stab*,content/core_pack/character/swing*,content/core_pack/character/animations/alt_idle*,content/core_pack/character/animations/climb*,content/core_pack/character/animations/fly*,content/core_pack/character/animations/stab*,content/core_pack/character/animations/swing*,content/core_pack/character/animations/idle/*,content/core_pack/character/animations/wander/*,content/core_pack/character/animations/sit/*,content/core_pack/character/animations/sleep/*,content/core_pack/character/animations/happy/*,content/core_pack/character/animations/gift/*,content/core_pack/character/animations/visitor/*,content/core_pack/character/emotes/face_variants.json,content/core_pack/character/meta/*,content/core_pack/character_visitor/*,content/core_pack/effects/gift_box/*,content/core_pack/effects/happy_sparkle/*,content/core_pack/effects/levelup/*,content/core_pack/effects/visitor_arrival/*,content/core_pack/effects/visitor_depart/*,content/core_pack/ui/*,content/imported/*,content/intermediate/*,content/sample_pack/*,content/types/*,runtime/actor/*,runtime/buddy/*,runtime/world/*,scenes/vertical_slice/*,tests/*,tools/*"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
