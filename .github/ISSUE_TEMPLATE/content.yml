name: Content / pack issue
description: A content pack, animation, overlay, or asset looks wrong or is missing.
title: "[content] "
labels: ["area:content"]
body:
  - type: input
    id: pack
    attributes:
      label: Pack / manifest
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Subject (action / state / overlay / item id)
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What is wrong
      description: What did you see vs expect? Include screenshots or short clips.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Provenance / source notes
      description: |
        If the content derives from a public reference, describe the reference
        (taxonomy/validation only — do not attach proprietary assets).
