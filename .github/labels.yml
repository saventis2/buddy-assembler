# Label set for buddy-assembler. Applied via `gh label create` (see
# docs/REVIEW_CHECKLIST.md). Reviewers expect every PR to carry one
# `area:*` and one `type:*`; add `risk:*` and `blocked:*` when relevant.

- name: "area:runtime"
  color: "1f77b4"
  description: "apps/runtime-godot and shipped runtime behavior"
- name: "area:importer"
  color: "7f7f7f"
  description: "Root Python importer / dev-host tooling"
- name: "area:content"
  color: "2ca02c"
  description: "Content packs, schema, validator, assets"
- name: "area:packaging"
  color: "9467bd"
  description: "Windows export, installer, artifacts, signing"
- name: "area:docs"
  color: "bcbd22"
  description: "Docs, PRD, status, release checklist"
- name: "area:ci"
  color: "17becf"
  description: "GitHub Actions, smoke, artifacts"

- name: "type:bug"
  color: "d62728"
  description: "Something is wrong"
- name: "type:feat"
  color: "2ca02c"
  description: "New behavior or content"
- name: "type:chore"
  color: "7f7f7f"
  description: "Repo hygiene, refactor, docs-only"
- name: "type:perf"
  color: "ff7f0e"
  description: "Performance / footprint"

- name: "risk:saves"
  color: "e377c2"
  description: "Touches persistence format, migration, or user:// layout"
- name: "risk:packaging"
  color: "8c564b"
  description: "Affects exported Windows build or release artifacts"
- name: "risk:provenance"
  color: "8c564b"
  description: "Touches content provenance or shipping-content sourcing"

- name: "blocked:pr-13"
  color: "000000"
  description: "Must wait for PR-13 provenance/promotion to merge"
- name: "scope-creep"
  color: "d62728"
  description: "PR is too wide and should be split"
