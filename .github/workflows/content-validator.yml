name: Content Validator

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Validate core content packs
        run: |
          set -euo pipefail
          for f in apps/runtime-godot/content/*/manifest.json; do
            echo "Validating $f"
            python packages/content-validator/validate_pack.py "$f"
          done

      - name: Run fixture checks
        run: |
          python packages/content-validator/run_fixture_checks.py

      - name: Verify CI/toolchain suite contract
        run: |
          python packages/content-validator/validate_ci_contract.py

      - name: Verify shipping payload declaration
        run: |
          python packages/content-validator/validate_shipping_closure.py

      - name: Run release artifact contract negatives
        run: |
          python packages/content-validator/test_release_artifact_checks.py

  verify-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR diffs against the base branch work.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Detect content changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Push to main — always verifying provenance."
            echo "run_verify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "${base_sha}...HEAD")"
          echo "Changed files vs base:"
          echo "${changed}"
          pattern='^(content/|apps/runtime-godot/content/|apps/runtime-godot/tools/(verify_content_promotion|approve_content_snapshot)\.py|\.github/workflows/content-validator\.yml)'
          if echo "${changed}" | grep -Eq "${pattern}"; then
            echo "Content paths touched — provenance verification required."
            echo "run_verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "No content/ changes — skipping provenance verification."
            echo "run_verify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify content promotion provenance
        if: steps.changes.outputs.run_verify == 'true'
        run: |
          set -euo pipefail
          # Explicit paths: the script's defaults are cwd-relative and would
          # silently [SKIP] (exit 0) when run from the repo root.
          python apps/runtime-godot/tools/verify_content_promotion.py \
            --intermediate-dir apps/runtime-godot/content/intermediate \
            --promotion-log apps/runtime-godot/content/promotion_log.json

