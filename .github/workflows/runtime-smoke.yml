name: Runtime smoke

on:
  pull_request:
  push:
    branches:
      - main

# Two jobs:
#  - parse-and-smoke (ubuntu): fast gate. Headless Godot import, parse check,
#    the shared required-scene contract, exact PASS markers, and a controlled
#    burn-in failure. Catches broken GDScript, false-green wrappers, and runtime
#    breakage on every PR.
#  - windows-export (windows): release-truth gate. Installs export templates,
#    exports the Windows build, starts its default runtime, and uploads it as an
#    artifact. Editor-play is not sufficient for release claims — this artifact
#    is.
#
# Both jobs upload logs on failure. Artifacts are retained 14 days.
#
# Godot binaries/export templates are cached (actions/cache, keyed on
# GODOT_RELEASE) so repeat runs at the same pinned version restore from
# cache instead of re-downloading from GitHub releases. A cache miss
# (first run at a given version, or a version bump) falls through to the
# normal download/install logic unchanged.

env:
  GODOT_VERSION: "4.2.2"
  GODOT_RELEASE: "4.2.2-stable"
  GODOT_REPORTED_VERSION: "4.2.2.stable.official.15073afe3"
  RCEDIT_VERSION: "2.0.0"
  RCEDIT_SHA256: "3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a"
  RUNTIME_DIR: apps/runtime-godot

jobs:
  parse-and-smoke:
    name: Parse + headless smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Cache Godot ${{ env.GODOT_VERSION }} binary (Linux)
        id: cache-godot-linux
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/godot
          key: godot-linux-${{ env.GODOT_RELEASE }}

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless Linux)
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-godot-linux.outputs.cache-hit }}" = "true" ] && [ -x /usr/local/bin/godot ]; then
            echo "Godot ${GODOT_RELEASE} restored from cache."
          else
            curl -fsSL -o godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            unzip -q godot.zip
            mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
            chmod +x /usr/local/bin/godot
          fi
          actual_version="$(godot --version)"
          echo "Godot ${actual_version}"
          if [ "${actual_version}" != "${GODOT_REPORTED_VERSION}" ]; then
            echo "Expected exact Godot ${GODOT_REPORTED_VERSION}, got ${actual_version}" >&2
            exit 1
          fi

      - name: Headless import (populate .godot cache)
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          # First run primes the import cache and then exits.
          godot --headless --import 2>&1 | tee ../../import.log || true
          # A second quit ensures import fully completes on some versions.
          godot --headless --quit 2>&1 | tee -a ../../import.log

      - name: Parse check
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          godot --headless --quit 2>&1 | tee ../../parse.log
          # Surface any GDScript parse errors explicitly.
          if grep -Ei "SCRIPT ERROR|Parse Error|error\(s\)" ../../parse.log; then
            echo "Parse errors detected." >&2
            exit 1
          fi

      - name: Required headless suite (shared local/CI contract)
        run: |
          set -euo pipefail
          python packages/content-validator/headless_suite.py \
            --godot godot \
            --project "${RUNTIME_DIR}" \
            --contract "${RUNTIME_DIR}/tests/required_headless_scenes.json" \
            --toolchain "${RUNTIME_DIR}/toolchain.json" \
            --timeout 90 2>&1 | tee headless-suite.log

      - name: Burn-in wrapper exit propagation negative
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File apps/runtime-godot/tests/test_run_burn_in.ps1 2>&1 |
            Tee-Object -FilePath burn-in-wrapper.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-smoke-logs
          path: |
            import.log
            parse.log
            headless-suite.log
            burn-in-wrapper.log
          retention-days: 14
          if-no-files-found: warn

  windows-export:
    name: Windows export (release-truth artifact)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Resolve Godot export-templates path (Windows)
        shell: pwsh
        run: |
          $base = Join-Path $env:APPDATA "Godot\export_templates\$($env:GODOT_VERSION).stable"
          "GODOT_TEMPLATES_DIR=$base" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Godot ${{ env.GODOT_VERSION }} binary (Windows)
        id: cache-godot-windows
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: godot-bin
          # v2 preserves the release archive's console/main executable pair.
          # Renaming either binary breaks the console wrapper's sibling lookup.
          key: godot-windows-console-pair-${{ env.GODOT_RELEASE }}-v2

      - name: Cache Godot ${{ env.GODOT_VERSION }} export templates (Windows)
        id: cache-godot-templates-windows
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GODOT_TEMPLATES_DIR }}
          key: godot-export-templates-windows-${{ env.GODOT_RELEASE }}

      - name: Install Godot ${{ env.GODOT_VERSION }} (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = $env:GODOT_RELEASE
          $godotDir = Join-Path (Get-Location).Path "godot-bin"
          $godotConsole = Get-ChildItem $godotDir -Filter "Godot_v*_win64_console.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $godotConsole) {
            $url = "https://github.com/godotengine/godot/releases/download/$release/Godot_v${release}_win64.exe.zip"
            Invoke-WebRequest -Uri $url -OutFile godot.zip
            Expand-Archive -Path godot.zip -DestinationPath godot-bin
            $godotConsole = Get-ChildItem $godotDir -Filter "Godot_v*_win64_console.exe" | Select-Object -First 1
            if (-not $godotConsole) {
              Write-Error "Godot archive did not contain the Windows console executable"
              exit 1
            }
          } else {
            Write-Host "Godot $release console/main executable pair restored from cache."
          }
          $godotExe = $godotConsole.FullName
          $godotMainExe = $godotExe -replace '_console\.exe$', '.exe'
          if (-not (Test-Path -LiteralPath $godotMainExe)) {
            Write-Error "Godot console companion executable is missing: $godotMainExe"
            exit 1
          }
          $godotDir | Out-File -FilePath $env:GITHUB_PATH -Append
          "GODOT_EXE=$godotExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          $versionOutput = @(& $godotExe --version 2>&1)
          $versionExit = if ($null -eq $LASTEXITCODE) { 0 } else { $LASTEXITCODE }
          $actualVersion = ($versionOutput -join "`n").Trim()
          Write-Host "Godot $actualVersion"
          if ($versionExit -ne 0 -or $actualVersion -ne $env:GODOT_REPORTED_VERSION) {
            Write-Error "Expected exact Godot '$($env:GODOT_REPORTED_VERSION)', got exit=$versionExit output='$actualVersion'"
            exit 1
          }

      - name: Install export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = $env:GODOT_RELEASE
          # Templates live under %APPDATA%/Godot/export_templates/<version>/
          # (path resolved into $env:GODOT_TEMPLATES_DIR by the earlier step).
          $base = $env:GODOT_TEMPLATES_DIR
          $cached = (Test-Path $base) -and ((Get-ChildItem $base -File -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0)
          if ($cached) {
            Write-Host "Export templates for $release restored from cache."
          } else {
            $url = "https://github.com/godotengine/godot/releases/download/$release/Godot_v${release}_export_templates.tpz"
            Invoke-WebRequest -Uri $url -OutFile templates.tpz
            New-Item -ItemType Directory -Force -Path $base | Out-Null
            Expand-Archive -Path templates.tpz -DestinationPath templates-extracted
            Get-ChildItem -Recurse "templates-extracted" -File | ForEach-Object {
              Copy-Item $_.FullName (Join-Path $base $_.Name) -Force
            }
          }
          Get-ChildItem $base | Select-Object -First 5

      - name: Install pinned rcedit ${{ env.RCEDIT_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolDir = Join-Path (Get-Location).Path "rcedit-bin"
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $rcedit = Join-Path $toolDir "rcedit.exe"
          $url = "https://github.com/electron/rcedit/releases/download/v$($env:RCEDIT_VERSION)/rcedit-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $rcedit
          $actual = (Get-FileHash -Algorithm SHA256 $rcedit).Hash.ToLower()
          if ($actual -ne $env:RCEDIT_SHA256) {
            Write-Error "rcedit SHA256 mismatch: expected $($env:RCEDIT_SHA256), got $actual"
            exit 1
          }
          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Pinned rcedit verified: v$($env:RCEDIT_VERSION) $actual"

      - name: Headless import (populate .godot cache)
        shell: pwsh
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          # This is a cache-populate step, not a gate. godot.exe may exit
          # non-zero on benign editor warnings (e.g. addon import noise,
          # display-server cursor warnings). The real gate is the export
          # step below, which checks for the produced .exe.
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:GODOT_EXE --headless --import 2>&1 | Tee-Object -FilePath ..\..\win-import.log
          Write-Host "godot --import exited with $LASTEXITCODE"
          & $env:GODOT_EXE --headless --quit  2>&1 | Tee-Object -FilePath ..\..\win-import.log -Append
          Write-Host "godot --quit exited with $LASTEXITCODE"
          exit 0

      - name: Export Windows Desktop preset
        shell: pwsh
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path (Resolve-Path ..\..).Path "build\windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Join-Path $out "BuddyRuntime.exe"
          # Preset name is defined in apps/runtime-godot/export_presets.cfg.
          # If the preset is not named "Windows Desktop", the following step
          # will fail loudly and the preset name should be corrected in a
          # follow-up; PR-07 formalizes packaging layout.
          & $env:GODOT_EXE --headless --export-release "Windows Desktop" $exe 2>&1 |
            Tee-Object -FilePath ..\..\win-export.log
          $exportExit = $LASTEXITCODE
          if ($exportExit -ne 0) {
            Write-Error "Godot export failed with exit $exportExit — see win-export.log"
            exit $exportExit
          }
          if (Select-String -Path ..\..\win-export.log -Pattern '^(ERROR|SCRIPT ERROR):' -Quiet) {
            Write-Error "Exporter emitted an error — see win-export.log"
            exit 1
          }
          if (-not (Test-Path $exe)) {
            Write-Error "Export did not produce $exe — see win-export.log"
            exit 1
          }
          Get-ChildItem $out

      - name: Verify Buddy Windows VersionInfo
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $preset = Get-Content -Raw apps/runtime-godot/export_presets.cfg
          function Get-PresetString([string]$key) {
            $pattern = '(?m)^' + [regex]::Escape($key) + '="([^"]*)"\r?$'
            $match = [regex]::Match($preset, $pattern)
            if (-not $match.Success) {
              throw "Missing export preset setting: $key"
            }
            return $match.Groups[1].Value
          }
          $versionInfo = (Get-Item build/windows/BuddyRuntime.exe).VersionInfo
          $expected = [ordered]@{
            CompanyName = Get-PresetString 'application/company_name'
            ProductName = Get-PresetString 'application/product_name'
            FileDescription = Get-PresetString 'application/file_description'
            FileVersion = Get-PresetString 'application/file_version'
            ProductVersion = Get-PresetString 'application/product_version'
          }
          foreach ($field in $expected.Keys) {
            $actual = [string]$versionInfo.$field
            if ($actual -ne $expected[$field]) {
              Write-Error "VersionInfo $field mismatch: expected '$($expected[$field])', got '$actual'"
              exit 1
            }
            Write-Host "$field=$actual"
          }
          if ($versionInfo.ProductName -eq 'Godot Engine' -or $versionInfo.CompanyName -eq 'Godot Engine') {
            Write-Error "Exported executable still identifies itself as Godot Engine"
            exit 1
          }

      - name: Verify exact exported PCK inventory
        shell: pwsh
        run: |
          python packages/content-validator/release_artifact_checks.py verify-pck --pck build/windows/BuddyRuntime.pck --contract packages/content-validator/shipping_inventory.json

      - name: Run exported payload self-check
        shell: pwsh
        working-directory: build/windows
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = Join-Path (Get-Location).Path "BuddyRuntime.exe"
          & $exe --headless -- --verify-export-closure 2>&1 |
            Tee-Object -FilePath ..\..\win-export-closure.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Exported runtime closure self-check failed with exit $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          if (-not (Select-String -Path ..\..\win-export-closure.log -Pattern '^export_closure_check: PASS$' -Quiet)) {
            Write-Error "Exported runtime did not emit the exact closure PASS marker"
            exit 1
          }

      - name: Start and cleanly exit exported default runtime
        shell: pwsh
        working-directory: build/windows
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = Join-Path (Get-Location).Path "BuddyRuntime.exe"
          & $exe --headless -- --ci-startup-smoke 2>&1 |
            Tee-Object -FilePath ..\..\win-startup-smoke.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Exported default-runtime startup failed with exit $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          if (Select-String -Path ..\..\win-startup-smoke.log -Pattern '^\s*(SCRIPT ERROR|ERROR):|\bParse Error\b' -Quiet) {
            Write-Error "Exported default runtime emitted an error — see win-startup-smoke.log"
            exit 1
          }
          if (-not (Select-String -Path ..\..\win-startup-smoke.log -Pattern '^project_startup_smoke: PASS$' -Quiet)) {
            Write-Error "Exported default runtime did not emit the exact startup PASS marker"
            exit 1
          }

      - name: Stage artifact and generate portable SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path (Get-Location).Path "build\windows"
          if (-not (Test-Path $out)) {
            Write-Error "build\windows missing — export must have failed"
            exit 1
          }
          $stage = Join-Path (Get-Location).Path "build\artifact-stage"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item (Join-Path $out "BuddyRuntime.exe") $stage
          Copy-Item (Join-Path $out "BuddyRuntime.pck") $stage
          python packages/content-validator/release_artifact_checks.py write-checksums --root $stage
          Write-Host "--- SHA256SUMS ---"
          Get-Content (Join-Path $stage "SHA256SUMS")

      - name: Verify checksum from staged download-equivalent layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $checker = (Resolve-Path packages/content-validator/release_artifact_checks.py).Path
          Push-Location build/artifact-stage
          try {
            python $checker verify-checksums --root .
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buddy-runtime-windows
          path: build/artifact-stage/**
          retention-days: 14
          if-no-files-found: error

      - name: Upload Windows logs (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-export-logs
          path: |
            win-import.log
            win-export.log
            win-export-closure.log
            win-startup-smoke.log
          retention-days: 14
          if-no-files-found: warn
