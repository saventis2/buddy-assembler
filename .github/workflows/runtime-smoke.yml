name: Runtime smoke

on:
  pull_request:
  push:
    branches:
      - main

# Two jobs:
#  - parse-and-smoke (ubuntu): fast gate. Headless Godot import, parse check,
#    and the SmokeFloorLockTest scene. Catches broken GDScript and obvious
#    runtime breakage on every PR.
#  - windows-export (windows): release-truth gate. Installs export templates,
#    exports the Windows build, uploads it as an artifact. Editor-play is not
#    sufficient for release claims — this artifact is.
#
# Both jobs upload logs on failure. Artifacts are retained 14 days.
#
# Godot binaries/export templates are cached (actions/cache, keyed on
# GODOT_RELEASE) so repeat runs at the same pinned version restore from
# cache instead of re-downloading from GitHub releases. A cache miss
# (first run at a given version, or a version bump) falls through to the
# normal download/install logic unchanged.

env:
  GODOT_VERSION: "4.2.2"
  GODOT_RELEASE: "4.2.2-stable"
  RUNTIME_DIR: apps/runtime-godot

jobs:
  parse-and-smoke:
    name: Parse + headless smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache Godot ${{ env.GODOT_VERSION }} binary (Linux)
        id: cache-godot-linux
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/godot
          key: godot-linux-${{ env.GODOT_RELEASE }}

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless Linux)
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-godot-linux.outputs.cache-hit }}" = "true" ] && [ -x /usr/local/bin/godot ]; then
            echo "Godot ${GODOT_RELEASE} restored from cache."
          else
            curl -fsSL -o godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            unzip -q godot.zip
            mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
            chmod +x /usr/local/bin/godot
          fi
          godot --version

      - name: Headless import (populate .godot cache)
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          # First run primes the import cache and then exits.
          godot --headless --import 2>&1 | tee ../../import.log || true
          # A second quit ensures import fully completes on some versions.
          godot --headless --quit 2>&1 | tee -a ../../import.log

      - name: Parse check
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          godot --headless --quit 2>&1 | tee ../../parse.log
          # Surface any GDScript parse errors explicitly.
          if grep -Ei "SCRIPT ERROR|Parse Error|error\(s\)" ../../parse.log; then
            echo "Parse errors detected." >&2
            exit 1
          fi

      - name: Smoke floor-lock test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          # Hard per-test timeout: if Godot hangs (e.g. scene fails to parse and
          # _ready never runs so get_tree().quit() is never reached), we want a
          # fast red signal instead of burning the 15-min job budget.
          timeout 90s godot --headless --path . res://tests/SmokeFloorLockTest.tscn 2>&1 | tee ../../smoke.log

      - name: Save-store durability test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . res://tests/SaveStoreTest.tscn 2>&1 | tee ../../save-store.log
          grep -E "save_store_test: PASS" ../../save-store.log

      - name: Pack validation + fallback test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . res://tests/PackValidationTest.tscn 2>&1 | tee ../../pack-validation.log
          grep -E "pack_validation_test: PASS" ../../pack-validation.log

      - name: Portable visual fallback test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . res://tests/PortableVisualFallbackTest.tscn 2>&1 | tee ../../portable-visual-fallback.log
          grep -E "portable_visual_fallback_test: PASS \(19 shipping frames\)" ../../portable-visual-fallback.log

      - name: World + economy flow test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . res://tests/WorldEconomyFlowTest.tscn 2>&1 | tee ../../world-economy-flow.log
          grep -E "world_economy_flow_test: PASS" ../../world-economy-flow.log

      - name: Companion depth cadence test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . res://tests/CompanionDepthTest.tscn 2>&1 | tee ../../companion-depth.log
          grep -E "companion_depth_test: PASS" ../../companion-depth.log

      - name: Economy tuning test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . res://tests/EconomyTuningTest.tscn 2>&1 | tee ../../economy-tuning.log
          grep -E "economy_tuning_test: PASS" ../../economy-tuning.log

      - name: World variety test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . res://tests/WorldVarietyTest.tscn 2>&1 | tee ../../world-variety.log
          grep -E "world_variety_test: PASS" ../../world-variety.log

      - name: Prompt cadence test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . res://tests/PromptCadenceTest.tscn 2>&1 | tee ../../prompt-cadence.log
          grep -E "prompt_cadence_test: PASS" ../../prompt-cadence.log

      - name: Chat command router test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . res://tests/ChatCommandRouterTest.tscn 2>&1 | tee ../../chat-command-router.log
          grep -E "chat_command_router_test: PASS" ../../chat-command-router.log

      - name: Manual verification report test
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . res://tests/ManualVerificationReportTest.tscn 2>&1 | tee ../../manual-verification-report.log
          grep -E "manual_verification_report_test: PASS" ../../manual-verification-report.log

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-smoke-logs
          path: |
            import.log
            parse.log
            smoke.log
            save-store.log
            pack-validation.log
            portable-visual-fallback.log
            world-economy-flow.log
            companion-depth.log
            economy-tuning.log
            world-variety.log
            prompt-cadence.log
            chat-command-router.log
            manual-verification-report.log
          retention-days: 14
          if-no-files-found: warn

  windows-export:
    name: Windows export (release-truth artifact)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve Godot export-templates path (Windows)
        shell: pwsh
        run: |
          $base = Join-Path $env:APPDATA "Godot\export_templates\$($env:GODOT_VERSION).stable"
          "GODOT_TEMPLATES_DIR=$base" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Godot ${{ env.GODOT_VERSION }} binary (Windows)
        id: cache-godot-windows
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: godot-bin
          key: godot-windows-${{ env.GODOT_RELEASE }}

      - name: Cache Godot ${{ env.GODOT_VERSION }} export templates (Windows)
        id: cache-godot-templates-windows
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GODOT_TEMPLATES_DIR }}
          key: godot-export-templates-windows-${{ env.GODOT_RELEASE }}

      - name: Install Godot ${{ env.GODOT_VERSION }} (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = $env:GODOT_RELEASE
          $exe = Get-ChildItem godot-bin -Filter "godot.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $url = "https://github.com/godotengine/godot/releases/download/$release/Godot_v${release}_win64.exe.zip"
            Invoke-WebRequest -Uri $url -OutFile godot.zip
            Expand-Archive -Path godot.zip -DestinationPath godot-bin
            $downloaded = Get-ChildItem godot-bin -Filter "Godot_v*_win64.exe" | Select-Object -First 1
            Rename-Item $downloaded.FullName (Join-Path $downloaded.Directory "godot.exe")
          } else {
            Write-Host "Godot $release restored from cache."
          }
          "$((Get-Location).Path)\godot-bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$((Get-Location).Path)\godot-bin\godot.exe" --version

      - name: Install export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = $env:GODOT_RELEASE
          # Templates live under %APPDATA%/Godot/export_templates/<version>/
          # (path resolved into $env:GODOT_TEMPLATES_DIR by the earlier step).
          $base = $env:GODOT_TEMPLATES_DIR
          $cached = (Test-Path $base) -and ((Get-ChildItem $base -File -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0)
          if ($cached) {
            Write-Host "Export templates for $release restored from cache."
          } else {
            $url = "https://github.com/godotengine/godot/releases/download/$release/Godot_v${release}_export_templates.tpz"
            Invoke-WebRequest -Uri $url -OutFile templates.tpz
            New-Item -ItemType Directory -Force -Path $base | Out-Null
            Expand-Archive -Path templates.tpz -DestinationPath templates-extracted
            Get-ChildItem -Recurse "templates-extracted" -File | ForEach-Object {
              Copy-Item $_.FullName (Join-Path $base $_.Name) -Force
            }
          }
          Get-ChildItem $base | Select-Object -First 5

      - name: Headless import (populate .godot cache)
        shell: pwsh
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          # This is a cache-populate step, not a gate. godot.exe may exit
          # non-zero on benign editor warnings (e.g. addon import noise,
          # display-server cursor warnings). The real gate is the export
          # step below, which checks for the produced .exe.
          $PSNativeCommandUseErrorActionPreference = $false
          godot.exe --headless --import 2>&1 | Tee-Object -FilePath ..\..\win-import.log
          Write-Host "godot --import exited with $LASTEXITCODE"
          godot.exe --headless --quit  2>&1 | Tee-Object -FilePath ..\..\win-import.log -Append
          Write-Host "godot --quit exited with $LASTEXITCODE"
          exit 0

      - name: Export Windows Desktop preset
        shell: pwsh
        working-directory: ${{ env.RUNTIME_DIR }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path (Resolve-Path ..\..).Path "build\windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Join-Path $out "BuddyRuntime.exe"
          # Preset name is defined in apps/runtime-godot/export_presets.cfg.
          # If the preset is not named "Windows Desktop", the following step
          # will fail loudly and the preset name should be corrected in a
          # follow-up; PR-07 formalizes packaging layout.
          godot.exe --headless --export-release "Windows Desktop" $exe 2>&1 |
            Tee-Object -FilePath ..\..\win-export.log
          if (-not (Test-Path $exe)) {
            Write-Error "Export did not produce $exe — see win-export.log"
            exit 1
          }
          Get-ChildItem $out

      - name: Run exported payload self-check
        shell: pwsh
        working-directory: build/windows
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = Join-Path (Get-Location).Path "BuddyRuntime.exe"
          & $exe --headless -- --verify-export-closure 2>&1 |
            Tee-Object -FilePath ..\..\win-export-closure.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Exported runtime closure self-check failed with exit $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          if (-not (Select-String -Path ..\..\win-export-closure.log -Pattern '^export_closure_check: PASS$' -Quiet)) {
            Write-Error "Exported runtime did not emit the exact closure PASS marker"
            exit 1
          }

      - name: Compute SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path (Get-Location).Path "build\windows"
          if (-not (Test-Path $out)) {
            Write-Error "build\windows missing — export must have failed"
            exit 1
          }
          Get-ChildItem -Path $out -Recurse -File | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            $rel  = Resolve-Path -Relative $_.FullName
            "$hash  $rel"
          } | Set-Content -Path (Join-Path $out "SHA256SUMS") -Encoding ascii
          Write-Host "--- SHA256SUMS ---"
          Get-Content (Join-Path $out "SHA256SUMS")

      - name: Upload Windows build artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buddy-runtime-windows
          path: build/windows/**
          retention-days: 14
          if-no-files-found: error

      - name: Upload Windows logs (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-export-logs
          path: |
            win-import.log
            win-export.log
            win-export-closure.log
          retention-days: 14
          if-no-files-found: warn
